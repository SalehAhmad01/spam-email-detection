<aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between flex-shrink-0 min-h-[calc(100vh-4rem)]">
    <!-- Top Navigation Links -->
    <div class="p-4 space-y-6">
        <div>
            <p class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-3 mb-2">Main Navigation</p>
            <nav class="space-y-1">
                <!-- Dashboard Link -->
                <a href="{% url 'dashboard:home' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.namespace == 'dashboard' %}bg-slate-800 text-blue-400 border-l-2 border-blue-500{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span>Overview Dashboard</span>
                </a>

                <!-- Detector Link -->
                <a href="{% url 'detector:scan' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.namespace == 'detector' %}bg-slate-800 text-blue-400 border-l-2 border-blue-500{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                    <span>Threat Detector</span>
                </a>

                <!-- Inbox Link -->
                <a href="{% url 'inbox:list' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.namespace == 'inbox' %}bg-slate-800 text-blue-400 border-l-2 border-blue-500{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                    </svg>
                    <span>Fraud & Spam Inbox</span>
                </a>
            </nav>
        </div>

        <div>
            <p class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-3 mb-2">Account & Security</p>
            <nav class="space-y-1">
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:profile' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'profile' %}bg-slate-800 text-blue-400 border-l-2 border-blue-500{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <span>User Profile</span>
                    </a>
                    <form action="{% url 'accounts:logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-red-400 hover:bg-slate-800/50 transition-colors text-left">
                            <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                            </svg>
                            <span>Sign Out</span>
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                        </svg>
                        <span>Sign In</span>
                    </a>
                    <a href="{% url 'accounts:register' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                        </svg>
                        <span>Register</span>
                    </a>
                {% endif %}
            </nav>
        </div>
    </div>


    <!-- Bottom Status Card -->
    <div class="p-4 border-t border-slate-800">
        <div class="p-3 bg-slate-950 border border-slate-800 rounded-lg">
            <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-semibold text-slate-300">Engine Status</span>
                <span class="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded font-mono">ACTIVE</span>
            </div>
            <p class="text-[11px] text-slate-400">ML Threat Filter v2.4 (NG-Core)</p>
        </div>
    </div>
</aside>
