<header class="h-16 bg-slate-900 border-b border-slate-800 text-slate-200 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
    <!-- Left: Mobile menu toggle & Brand -->
    <div class="flex items-center space-x-4">
        <button id="sidebar-toggle" class="md:hidden text-slate-400 hover:text-white focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="flex items-center space-x-3">
            <div class="h-9 w-9 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow-sm">
                🛡️
            </div>
            <div class="flex flex-col">
                <span class="text-base font-bold text-white tracking-tight">SMS & Email Guard</span>
                <span class="text-[10px] uppercase font-semibold tracking-wider text-slate-400">Anti-Fraud Intelligence</span>
            </div>
        </div>
    </div>

    <!-- Center: Search bar -->
    <div class="hidden md:flex items-center flex-1 max-w-md mx-8">
        <div class="relative w-full">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </span>
            <input type="text" placeholder="Search phone number, email, or sender ID..." class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-4 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors">
        </div>
    </div>

    <!-- Right: Trust status & Profile -->
    <div class="flex items-center space-x-4">
        <!-- Region Badge -->
        <div class="hidden sm:flex items-center space-x-2 bg-slate-950 border border-slate-800 px-3 py-1 rounded-full text-xs font-medium">
            <span class="text-base">🇳🇬</span>
            <span class="text-slate-300">Nigeria Region</span>
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        </div>

        <!-- Notifications -->
        <button class="relative p-2 text-slate-400 hover:text-white transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <!-- Threat alert badge dot -->
            <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-red-500"></span>
        </button>

        <!-- User Auth Section -->
        <div class="flex items-center space-x-3 pl-2 border-l border-slate-800">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:profile' %}" class="flex items-center space-x-2 hover:opacity-80 transition-opacity">
                    <div class="w-8 h-8 rounded-full bg-blue-950 border border-blue-900 flex items-center justify-center text-xs font-bold text-blue-400">
                        {{ user.username|slice:":2"|upper }}
                    </div>
                    <span class="hidden md:inline-block text-xs font-medium text-slate-300">{{ user.username }}</span>
                </a>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="text-xs text-slate-300 hover:text-white font-medium px-2 py-1 transition-colors">Sign In</a>
                <a href="{% url 'accounts:register' %}" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-3 py-1.5 rounded-lg shadow-sm transition-colors">Register</a>
            {% endif %}
        </div>
    </div>
</header>
