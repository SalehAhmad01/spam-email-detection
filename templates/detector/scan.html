{% extends 'base.html' %}

{% block title %}Scan Message | SMS & Email Guard{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 md:p-8 shadow-sm">
        <div class="flex items-center space-x-3 mb-6 border-b border-slate-800 pb-4">
            <div class="w-10 h-10 rounded-lg bg-blue-950 border border-blue-900/50 flex items-center justify-center text-blue-400 font-bold">
                🔍
            </div>
            <div>
                <h2 class="text-xl font-bold text-white">Threat Detection Inspector</h2>
                <p class="text-xs text-slate-400">Analyze text snippets, email bodies, or SMS content against NLP spam vectors.</p>
            </div>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="channel" class="block text-xs font-semibold uppercase text-slate-400 tracking-wider mb-2">Select Channel / Media</label>
                <select id="channel" name="channel" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors">
                    <option value="sms">SMS Text Message</option>
                    <option value="email">Email Body</option>
                    <option value="whatsapp">WhatsApp / Instant Message</option>
                </select>
            </div>

            <div>
                <label for="message_text" class="block text-xs font-semibold uppercase text-slate-400 tracking-wider mb-2">Message Content</label>
                <textarea id="message_text" name="message_text" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors font-mono" placeholder="Paste SMS or email content here (e.g. 'Urgent: Your account #4928 has been suspended...')..."></textarea>
            </div>

            <div class="flex justify-end">
                <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm rounded-lg shadow-sm transition-colors flex items-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                    <span>Run Threat Analysis</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
